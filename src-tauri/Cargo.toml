[package]
name = "charon"
version = "0.18.2"
description = "Desktop app for managing connections to multiple AWS accounts via AWS Identity Center"
authors = ["platform"]
repository = "https://github.com/andrea-spoldi/charon"
edition = "2021"
rust-version = "1.77"

[lib]
name = "charon_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "charon"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
dirs = "7"
rust-ini = "0.21"
open = "5"
url = "2"
urlencoding = "2"
# rustls-no-provider + ring (installed in aws::oidc::http_client): avoids
# aws-lc-rs, whose aws-lc-sys build needs NASM on Windows x86_64 (D-009).
reqwest = { version = "0.13", features = ["json", "rustls-no-provider"], default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { version = "1", features = ["time", "process", "rt-multi-thread"] }
sha1 = "0.11"
uuid = { version = "1", features = ["v4"] }
nix = { version = "0.32", features = ["signal", "process"] }
libc = "0.2"
portable-pty = "0.9.0"
base64 = "0.23.1"

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
