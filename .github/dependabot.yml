# Dependabot configuration
# Opens grouped dependency-update PRs so security fixes arrive automatically
# instead of silently accumulating as alerts.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Frontend / build toolchain (pnpm — handled by the npm ecosystem)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # All security fixes for this ecosystem land in one PR.
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      # Batch routine minor/patch bumps into a single PR to reduce noise.
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Major bumps get their own single PR, since they may need code changes.
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"

  # Rust backend (Tauri)
  # Root, not /src-tauri: this is a Cargo workspace and the only Cargo.lock
  # lives at the root. Pointing at /src-tauri bumped Cargo.toml without
  # updating the lockfile (see the nix 0.32 PR).
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-security:
        applies-to: security-updates
        patterns:
          - "*"
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      cargo-major:
        patterns:
          - "*"
        update-types:
          - "major"

  # Keep GitHub Actions used in workflows up to date too.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"
